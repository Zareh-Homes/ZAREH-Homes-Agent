# Regression gate: every push and pull request. Nothing deploys unless all of this passes.
name: ci
on: [push, pull_request]
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3", cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client age
      - name: Migrations apply from scratch, and re-running changes nothing
        run: brokerage-db/migrate.sh && brokerage-db/migrate.sh | grep -q "Up to date"
      - run: npm ci
        working-directory: backend
      - name: Prisma schema matches the migrated database
        working-directory: backend
        run: |
          diff=$(npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ../brokerage-db/schema.prisma --script)
          echo "$diff" | grep -q "This is an empty migration" || { echo "$diff"; exit 1; }
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Production configuration check refuses an unsafe configuration
        working-directory: backend
        run: "! NODE_ENV=production node scripts/check-config.ts"
      - name: Dependency vulnerabilities (high or critical fails the build)
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Backup and restore round trip
        run: |
          age-keygen -o /tmp/key.txt
          pub=$(grep "public key" /tmp/key.txt | awk '{print $4}')
          out=$(BACKUP_DIR=/tmp/backups BACKUP_RECIPIENT=$pub ops/backup.sh)
          RESTORE_ADMIN_URL=$DATABASE_URL ops/restore-test.sh "$out" "${out%.dump.age}.manifest.json" /tmp/key.txt

  commission-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - run: npm test
        working-directory: commission-engine

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - name: Dependency vulnerabilities, dev tools included (high or critical fails the build)
        run: npm audit --audit-level=high
        working-directory: frontend

  e2e:
    # The built web app in a real browser against the real API (session mode: cookies, CSRF, MFA) and a fresh database
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      E2E_ADMIN_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npm audit --audit-level=high && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Browser test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-report, path: "e2e/report/", retention-days: 30 }

  migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client && brokerage-db/migrate.sh
      - run: pip install -r requirements-dev.txt && python -m pytest -q
        working-directory: migration
      - name: Dependency vulnerabilities (any known advisory fails the build)
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements-dev.txt
        working-directory: migration

  images:
    # Build the two deployable images, run them the way production does, and scan them
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: docker build -f backend/Dockerfile -t zareh-api:ci .
      - run: docker build -f frontend/Dockerfile -t zareh-web:ci .
      - name: Images start and behave as in production (TLS database, restricted login, non-root, refusals)
        run: ops/image-smoke.sh zareh-api:ci zareh-web:ci
      - name: Vulnerability scan (fixable high or critical fails the build)
        run: |
          failed=0
          for image in zareh-api:ci zareh-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$image" || failed=1
          done
          exit $failed

  staging:
    # Rehearsal of a staging deployment: production images, TLS-only database with the restricted login,
    # HTTPS in front, the whole browser suite over HTTPS, then log / permission / audit / backup checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.23.3" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client age
      - run: docker build -f backend/Dockerfile -t zareh-api:ci . && docker build -f frontend/Dockerfile -t zareh-web:ci .
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - run: ops/staging-rehearsal.sh zareh-api:ci zareh-web:ci
      - name: Local trial (ops/local-trial.sh) starts and hands out the first sign-in link
        shell: bash
        run: |
          set -o pipefail
          ops/local-trial.sh | tee /tmp/trial.out
          grep -q 'http://localhost:8080/accept-invite#token=' /tmp/trial.out
          curl -fsS http://localhost:8080/readyz
          ops/local-trial.sh reset
      - name: Rehearsal report, screenshots and container logs
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: staging-rehearsal, path: "e2e/report/", retention-days: 30 }

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
