# Local development and staging rehearsal. Not a production deployment: production uses a managed
# PostgreSQL with TLS, the deployment's secret store, and the restricted application login.
#   cp ops/env/development.env.example .env && docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: zareh
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 10 }
  migrate:
    image: postgres:16
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/zareh
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes: [./brokerage-db:/brokerage-db:ro, ./ops:/ops:ro]
    # Migrations as the owner, then the restricted login the API uses (member of zareh_app)
    entrypoint: ["bash", "-c", "/brokerage-db/migrate.sh && psql \"$$DATABASE_URL\" -v pw=\"$$APP_DB_PASSWORD\" -f /ops/create-app-login.sql"]
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { migrate: { condition: service_completed_successfully } }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://zareh_app_login:${APP_DB_PASSWORD:?set in .env}@db:5432/zareh
    volumes: [uploads:/var/lib/zareh/uploads]
  web:
    build: { context: ., dockerfile: frontend/Dockerfile }
    depends_on: [api]
    ports: ["8080:8080"]
volumes:
  dbdata: {}
  uploads: {}
