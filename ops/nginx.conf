# Serves the built web app and proxies /api to the backend on the same origin (cookies are SameSite=Strict).
# TLS terminates at the load balancer in front of this; HSTS is set there and by the API.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  client_max_body_size 26m;

  location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  location = /healthz { proxy_pass http://api:3000; }
  location = /readyz { proxy_pass http://api:3000; }
  location / { try_files $uri /index.html; }
}
